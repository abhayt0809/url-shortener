<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>URL Shortener</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 80px auto; padding: 0 16px; }
    input { width: 70%; padding: 10px; font-size: 16px; }
    button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
    #result { margin-top: 20px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input id="url" type="text" placeholder="Paste a long URL (https://...)" />
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

  <script>
    async function shorten() {
      const url = document.getElementById("url").value.trim();
      const out = document.getElementById("result");
      out.textContent = "Working...";
      try {
        const res = await fetch("/api/shorten", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        if (!res.ok) { out.textContent = "Invalid URL. Include https://"; return; }
        const data = await res.json();
        out.innerHTML = `Short link: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
      } catch (e) {
        out.textContent = "Something went wrong.";
      }
    }
  </script>
</body>
</html>
